services:
  postgres:
    image: postgres:16-alpine
    container_name: shipment-tracker
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shipment-tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/progresql/data

volumes:
  postgres_data: