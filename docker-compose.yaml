services:
  postgres:
    image: postgres:16-alpine
    container_name: shipment-tracker
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shipment-tracker
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data: